name: Universidade quality gate

on:
  pull_request:
  push:
    branches:
      - "feature/universidade-*"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Testar site e contratos acadêmicos
        run: npm run check
      - name: Validar Edge Functions
        run: npm run check:functions
      - name: Verificar diferenças inválidas
        run: git diff --check
